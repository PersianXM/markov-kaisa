<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#102033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3de0ff"/>
      <stop offset="100%" stop-color="#ff4ecd"/>
    </linearGradient>
  </defs>
  <rect width="980" height="220" rx="22" fill="url(#card)" stroke="#7c3aed"/>
  <rect x="0" y="0" width="980" height="8" rx="4" fill="url(#accent)"/>
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#f5c542">OBJECTIVE</text>
  <text x="40" y="118" font-family="Cambria, Times New Roman, serif" font-size="36" fill="#f4f0ff">U  =  (p-tilde - p_avg)  -  lambda * CI95</text>
  <text x="40" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#b9a7e0">choose the path that maximizes U after the n-floor, not raw winrate</text>
</svg>
